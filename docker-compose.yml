services:
  postgres:
    image: postgres:16-alpine
    container_name: reply-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reply_crm
      POSTGRES_USER: reply_crm
      POSTGRES_PASSWORD: reply_crm_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reply_crm -d reply_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
